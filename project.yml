# xcodegen spec for Everest.
#
# Regenerate after ANY file add/rename:  xcodegen generate
#
# Three things here are load-bearing and were each found the hard way. See
# AGENTS.md section 7 for the full list of build gotchas.
#
#  1. A local package's `path:` resolves relative to THIS FILE, not the working
#     directory. That is why project.yml lives at the repo root. Moving it
#     produces `Spec validation error: Invalid local package "RewriteCore"`,
#     which points nowhere useful.
#  2. The app target needs an explicit `info:` block. Without one the build
#     fails with `Build input file cannot be found: .../Info.plist`, which
#     reads like a missing file rather than a missing generator directive.
#  3. Anything pulling in mlx-swift needs the Metal Toolchain component
#     installed (`xcodebuild -downloadComponent MetalToolchain`), because Cmlx
#     compiles ~40 .metal kernels during a normal build.

name: Everest

options:
  bundleIdPrefix: com.kabrapratik
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.2.7"
    CURRENT_PROJECT_VERSION: "12"
    # Ad-hoc signing, no development team. This is the ONLY configuration that
    # builds here, arrived at after two that do not:
    #
    #  1. Automatic signing fails: `No signing certificate "Mac Development"
    #     found ... matching team ID LHZZ485Q37`. The installed identity is the
    #     modern unified "Apple Development" type; automatic signing wants the
    #     legacy per-platform "Mac Development" one, which cannot be issued
    #     without a paid membership.
    #  2. Manual signing with "Apple Development" + a DEVELOPMENT_TEAM cascades
    #     the team requirement into every SPM dependency: `Signing for
    #     "swift-crypto_Crypto" requires a development team`, and the same for
    #     Cmlx, KeyboardShortcuts, swift-transformers and four others.
    #
    # Dependencies stay unsigned. Signing settings MUST NOT live here: anything
    # in `settings.base` reaches every SPM dependency target, and a real
    # identity here produces `Signing for "swift-crypto_Crypto" requires a
    # development team` for eight packages at once. The app's own identity is
    # set on the Everest target instead.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: YES
    # Deliberately NOT sandboxed. A sandboxed process cannot use the
    # cross-process Accessibility API at all, which is the entire product.
    # Do not add com.apple.security.app-sandbox.

packages:
  # One local package holding every testable target. Path is relative to THIS
  # FILE, which is why project.yml lives at the repo root.
  EverestKit:
    path: EverestKit
  # Only the app target uses this directly (the shortcut recorder UI).
  # Pinned exactly, not `from: 2.0.0`. Xcode resolves the app-level graph into
  # the workspace, which is gitignored, and no root `Package.resolved` is
  # tracked — so a range here means a clean checkout can silently resolve a
  # different 2.x and behave differently from the build that was tested.
  # `EverestKit`'s own dependencies are pinned with `exact:` in its Package.swift,
  # which binds Xcode's root resolution too; this one had nothing holding it.
  #
  # Expect `EverestKit/Package.resolved` to churn: `swift build` drops the
  # KeyboardShortcuts pin because the package does not depend on it, and an
  # Xcode build writes it back. Harmless — the `exact:` requirements decide
  # versions, not the lockfile. Commit whichever version you end up with.
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 2.4.0
  # Auto-updates. Exact for the same reason as above, and with more at stake:
  # this package is the channel by which new code reaches a user's machine.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  # mlx-swift-lm, swift-huggingface and swift-transformers are declared in
  # EverestKit/Package.swift, not here. They are the Engines target's
  # dependencies and reach the app transitively. One home for each version pin.

targets:
  Everest:
    type: application
    platform: macOS
    # THE APP ALONE gets a stable identity, and this is a correctness
    # requirement rather than a nicety.
    #
    # Accessibility permission is bound by TCC to the code signature. An ad-hoc
    # signature is just a hash of the binary, so every rebuild is a new
    # identity: the switch in System Settings stays on, pointing at a signature
    # that no longer exists, `AXIsProcessTrusted()` returns false, and the app
    # tells the user to enable a permission they can see is already enabled.
    # That cost a real debugging session.
    #
    # A stable identity keeps the grant across rebuilds. It lives in an xcconfig
    # and NOT here, because a certificate SHA-1 is machine-specific: hardcoding
    # one in the committed spec means a clean clone fails to build on every Mac
    # but this one. The xcconfig defaults to ad-hoc and optionally includes an
    # untracked `Signing.local.xcconfig`, so contributors build and this machine
    # keeps its grant. Everest/Signing.xcconfig has the details.
    #
    # Scoped to this target, not `settings.base`, so it cannot reach the
    # dependencies. Target-level settings would override the xcconfig, so there
    # must be no CODE_SIGN_* key below.
    configFiles:
      Debug: Everest/Signing.xcconfig
      Release: Everest/Signing.xcconfig
    sources:
      - path: Everest
        excludes:
          - "**/*.md"
          # Icon build inputs and the unused alternate icon. Only the .icns
          # named by CFBundleIconFile belongs in the bundle.
          - "Resources/make_icon.py"
          # Consumed via `configFiles:` above, not compiled or bundled.
          - "*.xcconfig"
          - "Resources/Artwork"
          - "Resources/AppIcon-alt.icns"
          # Appears the moment anyone imports make_icon.py rather than running
          # it; without this xcodegen picks it up and copies it into the app.
          - "**/__pycache__"
    info:
      path: Everest/Resources/Info.plist
      properties:
        CFBundleName: Everest
        CFBundleDisplayName: Everest
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: "15.0"
        # Menu-bar only. No Dock icon, no main window on launch.
        LSUIElement: true
        NSHumanReadableCopyright: ""
        # Shown in the system permission prompt.
        NSAccessibilityUsageDescription: >-
          Everest needs Accessibility access to read the text you select and
          replace it with the rewritten version. Text never leaves your Mac.
        # Sparkle. The feed is served from the repo's default branch rather
        # than GitHub Pages: both are free and HTTPS, and this one needs no
        # second deployment target that can silently stop publishing.
        SUFeedURL: https://raw.githubusercontent.com/kabrapratik28/Everest/main/appcast.xml
        # The public half of an EdDSA pair whose private half never leaves the
        # login Keychain and is never committed. This is the whole security
        # model: Sparkle refuses any update whose signature does not verify
        # against this key, so a compromised feed or release host cannot ship
        # code. Losing the private key means no user can ever be updated
        # again, because a new key cannot be trusted by an installed build.
        SUPublicEDKey: mbOXDy0sdnOAu3FJRhiy9YtByl9ql0puV8E6+Hhtcsk=
        # Install updates without asking, not merely check for them. The app
        # is small, the updates are signed, and the alternative is a prompt
        # the user dismisses until the build they are running is the one with
        # the bug. Both are reversible in Settings ▸ Privacy.
        SUAutomaticallyUpdate: true
        # On by default. The alternative was letting Sparkle ask on the
        # second launch, which sounds more respectful and is worse in
        # practice: a security-relevant fix only reaches people who said yes
        # to a dialog they met before they trusted the app.
        #
        # What makes the default defensible is that it is reversible *in the
        # app*: Settings ▸ Privacy carries the switch. A default that can
        # only be undone with `defaults write` is not a default, it is a
        # decision. PRIVACY.md documents the request and points at the
        # switch, and Sparkle owns this key so the switch writes it directly
        # rather than shadowing it in AppSettings.
        SUEnableAutomaticChecks: true
    entitlements:
      path: Everest/Resources/Everest.entitlements
      properties:
        # Hardened Runtime is on, and MLX JIT-compiles Metal shaders at
        # runtime, so the JIT exception is required or model load crashes.
        com.apple.security.cs.allow-jit: true
    # MLX, HuggingFace and Tokenizers are NOT listed here. They arrive
    # transitively through EverestKit's Engines target, which is where they
    # belong. Declaring them again in the app would be a second place for the
    # version pins to drift.
    dependencies:
      - package: Sparkle
      - package: EverestKit
        product: AppCore
      - package: EverestKit
        product: RewriteCore
      - package: EverestKit
        product: TextBridge
      - package: EverestKit
        product: Engines
      - package: EverestKit
        product: Overlay
      - package: KeyboardShortcuts

schemes:
  Everest:
    build:
      targets:
        Everest: all
